  <text x="360" y="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="600">muhnazih@github — zsh</text>

  <!-- Avatar (neofetch logo side) -->
