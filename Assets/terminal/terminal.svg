    <text x="170" y="140"><tspan fill="#89b4fa" font-weight="700">Role:</tspan>    Software Engineer</text>
    <text x="170" y="158"><tspan fill="#89b4fa" font-weight="700">Focus:</tspan>   Web · Cloud · Networks</text>
    <text x="170" y="176"><tspan fill="#89b4fa" font-weight="700">Stack:</tspan>   TS · React · Astro · Node · Bun · PHP · Laravel · Prisma · Docker · Postgres</text>
